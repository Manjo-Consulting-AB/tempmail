name: PR-kontroll (Semgrep + Composer)

# main.yml kör Semgrep en gång i veckan, och prod.yml kör den på push till main
# (där den grindar deployen). En PR mot main scannas alltså inte alls förrän
# den redan är mergad, om inte det här jobbet gör det - vilket är i det
# ögonblick ett fynd är dyrast att hitta.
#
# Ursprungligen kördes detta bara mot redesign/mail-shield, dit redesignens
# ~27 PR:er mergades innan go-live. Den grenen är sedan #158 mergad till main
# och borttagen, så triggern pekar nu mot main direkt - samma gap finns för
# varje PR dit (t.ex. build/$n-grenarna från deepseek_watcher.sh).

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Samma konfiguration som main.yml och prod.yml - avsiktligt identisk, så att
  # en PR som är grön här inte kan fälla deployen vid go-live.
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Kör Semgrep Säkerhetsscan
        run: semgrep scan --config p/php --config p/security-audit --error ./

  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Kontrollera sårbarheter i Composer-paket
        run: composer audit --locked

  # Syntaxkontroll av all PHP. Billigt, och fångar den vanligaste regressionen
  # i ett frontendarbete: en trasig fil efter omflyttad markup.
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Sätt upp PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: php -l på alla PHP-filer
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "::error file=$f::Syntaxfel"; fail=1; }
          done < <(git ls-files '*.php')
          exit "$fail"
