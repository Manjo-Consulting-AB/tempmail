name: Säkerhetsscanning (PHP)

on:
  schedule:
    # Körs varje måndag kl 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Gör att du kan köra den manuellt när du vill

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4

      # Del 1: Scanna din egenutvecklade kod efter säkerhetshål (SQLi, XSS, etc.)
      - name: Semgrep Säkerhetsscan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/php
        # Det här steget kommer att varna dig om du t.ex. har skrivit en osäker SQL-fråga

      # Del 2: Kolla om dina externa PHP-bibliotek har kända sårbarheter
      - name: Sätt upp PHP (för Composer)
        uses: shivamathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Kontrollera sårbarheter i Composer-paket
        uses: symfonyorg/github-actions/local-php-security-checker@main
