name: Deploy to Production (Security gated)

on:
  push:
    branches:
      - main   # <-- Byt till den branch du pushar till (t.ex. master eller dev)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # JOBB 1: Scanna PHP-kod efter sårbarheter med Semgrep
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Kör Semgrep Säkerhetsscan
        run: semgrep scan --config p/php --config p/security-audit --error ./
  # JOBB 2: Kolla om externa Composer-bibliotek har kända säkerhetshål
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Kontrollera sårbarheter i Composer-paket
        working-directory: ./
        run: composer audit --locked
  # JOBB 3: Backend via rsync över SSH till manjo.me PROD (Körs BARA om BÅDE jobb 1 och 2 lyckas)
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [semgrep-scan, composer-audit] # <--- DUBBELSPÄRREN!
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Installera Composer-beroenden (produktion)
        # vendor/ är gitignorad och byggs här i CI, sedan laddas den upp via rsync
        # nedan. Utan detta steg finns t.ex. HTMLPurifier aldrig i produktion.
        run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Sätt upp SSH-nyckel för deploy
        # Dedikerat nyckelpar för det här jobbet - bara den publika nyckeln ligger
        # på servern (i authorized_keys), den privata finns enbart som secreten
        # SSH_PRIVATE_KEY. ssh-keyscan hämtar serverns värdnyckel färskt i varje
        # körning så known_hosts inte behöver checkas in, och StrictHostKeyChecking
        # står kvar på (yes) mot den nyss hämtade nyckeln.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_SERVER: ${{ secrets.SFTP_SERVER }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -T 15 -H "$SSH_SERVER" >> "$HOME/.ssh/known_hosts"
          # ssh-keyscan writes progress/diagnostics to stderr and returns non-zero
          # on a scan timeout even if it found nothing - surface that instead of
          # silently failing the step, and fail loudly (not just via `set -e`) if
          # known_hosts ended up empty.
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "::error::ssh-keyscan got no host key from $SSH_SERVER - see stderr above" >&2
            exit 1
          fi
      - name: Ladda upp via rsync över SSH
        # Nya hosting saknar SFTP-stöd men har SSH-skal, så vi kör rsync i stället
        # för lftp/FTPS. Två fördelar över den tidigare FTP-baserade lösningen:
        #
        # 1. --checksum jämför filinnehåll, inte tidsstämpel. En färsk git
        #    checkout ger alla filer "nu" som mtime i varje körning, så en
        #    tid/storlek-jämförelse (det lftp mirror gjorde) skulle ladda upp
        #    allt varje gång ändå - checksum gör att bara faktiskt ändrade filer
        #    överförs.
        # 2. rsync skriver till en temporär fil och byter namn atomiskt vid
        #    uppdatering. Filen försvinner aldrig på den levande servern under
        #    tiden den skrivs, till skillnad från lftp mirror som (odokumenterat
        #    och utan möjlig avstängning, se lavv17/lftp#148) tar bort filen
        #    innan den laddar upp en ny kopia.
        #
        # Inget --delete: filer som bara finns på servern (t.ex. attachments/)
        # rörs aldrig, samma icke-destruktiva beteende som tidigare.
        env:
          SSH_SERVER: ${{ secrets.SFTP_SERVER }}
          SSH_USERNAME: ${{ secrets.SFTP_USERNAME }}
        run: |
          rsync -az --checksum \
            -e "ssh -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='.semgrepignore' --exclude='CLAUDE.md' --exclude='documentaion' \
            --exclude='composer.lock' --exclude='composer.json' \
            ./ "$SSH_USERNAME@$SSH_SERVER:manjo.me/public_html/"
      - name: Städa bort SSH-nyckel
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
