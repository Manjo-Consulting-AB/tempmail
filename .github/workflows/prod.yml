name: Deploy to Production (Security gated)
on:
  push:
    branches:
      - main   # <-- Byt till den branch du pushar till (t.ex. master eller dev)
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # JOBB 1: Scanna PHP-kod efter sårbarheter med Semgrep
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Kör Semgrep Säkerhetsscan
        run: semgrep scan --config p/php --config p/security-audit --error ./
  # JOBB 2: Kolla om externa Composer-bibliotek har kända säkerhetshål
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Kontrollera sårbarheter i Composer-paket
        working-directory: ./
        run: composer audit --locked
  # JOBB 3: Backend via SFTP till manjo.me PROD (Körs BARA om BÅDE jobb 1 och 2 lyckas)
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [semgrep-scan, composer-audit] # <--- DUBBELSPÄRREN!
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Ladda upp ./ via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          server: ${{ secrets.SFTP_SERVER }}
          port: 22
          local_path: './'
          remote_path: './manjo.me/public_html/' # Kontot landar i hemkatalogen, webbroten en nivå ner
          sftp_only: true # Kontot saknar skal-/exec-åtkomst (endast SFTP-protokollet) - annars stänger servern anslutningen vid mkdir-kommandot
