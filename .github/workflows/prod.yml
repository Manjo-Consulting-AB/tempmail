name: Deploy to Production (Security gated)

on:
  push:
    branches:
      - main   # <-- Byt till den branch du pushar till (t.ex. master eller dev)
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = testa bara SSH-anslutning + rsync torrkörning (inget skrivs), deploy = ladda upp på riktigt'
        type: choice
        default: verify
        options:
          - verify
          - deploy

permissions:
  contents: read

jobs:
  # JOBB 1: Scanna PHP-kod efter sårbarheter med Semgrep
  semgrep-scan:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Kör Semgrep Säkerhetsscan
        run: semgrep scan --config p/php --config p/security-audit --error ./
  # JOBB 2: Kolla om externa Composer-bibliotek har kända säkerhetshål
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Kontrollera sårbarheter i Composer-paket
        working-directory: ./
        run: composer audit --locked
  # JOBB 3: Backend via rsync-över-SSH till manjo.me PROD (Körs BARA om BÅDE jobb 1 och 2 lyckas)
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [semgrep-scan, composer-audit] # <--- DUBBELSPÄRREN!
    env:
      # Push till main = riktig deploy. Manuell körning styrs av "mode"-inputen
      # och står på verify (torrkörning) som default.
      DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
      SSH_HOST: ${{ secrets.SFTP_SERVER }}
      SSH_USER: ${{ secrets.SFTP_USERNAME }}
      # Inleed kör SSH på 2020, inte 22. Kan överstyras med en SSH_PORT-secret.
      SSH_PORT: ${{ secrets.SSH_PORT || '2020' }}
      # DirectAdmin-layout hos Inleed: varje domän har sin egen public_html under
      # domains/. OBS att ~/public_html är en symlink till manjo.se - alltså fel
      # domän - så den vägen får inte användas. Kan överstyras med REMOTE_DIR.
      REMOTE_DIR: ${{ secrets.REMOTE_DIR || 'domains/manjo.me/public_html' }}
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v5
      - name: Installera Composer-beroenden (produktion)
        # vendor/ är gitignorad och byggs här i CI, sedan laddas den upp med
        # rsync nedan. Utan detta steg finns t.ex. HTMLPurifier aldrig i produktion.
        run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Sätt upp SSH-nyckel och known_hosts
        # Nyckeln ligger i secrets.SSH_PRIVATE_KEY (publika delen är utlagd i
        # ~/.ssh/authorized_keys hos Inleed). Värdnyckeln hämtas i första hand
        # från secrets.SSH_KNOWN_HOSTS; saknas den gör vi ssh-keyscan (TOFU) så
        # att StrictHostKeyChecking kan stå kvar påslaget.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY saknas eller är tom."
            exit 1
          fi
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ]; then
            echo "::error::Secret SFTP_SERVER och/eller SFTP_USERNAME saknas."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "SSH_KNOWN_HOSTS saknas - hämtar värdnyckeln med ssh-keyscan."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          # Nyckeltyp/fingeravtryck loggas för felsökning - aldrig själva nyckeln.
          ssh-keygen -l -f ~/.ssh/deploy_key
      - name: Verifiera SSH-anslutningen
        # Loggar in, kontrollerar att rsync finns på servern och att målkatalogen
        # existerar och är skrivbar. Kandidatlistan skrivs ut för felsökning om
        # webroot skulle ligga någon annanstans (olika kontrollpaneler lägger den
        # på olika ställen: DirectAdmin domains/<domän>/public_html, cPanel
        # public_html osv).
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "bash -s -- '$REMOTE_DIR'" <<'REMOTE'
          set -u
          target="$1"
          echo "--- inloggad som: $(id -un)"
          echo "--- hemkatalog:   $HOME"
          echo "--- rsync:        $(command -v rsync || echo 'SAKNAS')"
          echo "--- kandidatvägar för webroot (relativt hemkatalogen):"
          for d in "$target" domains/manjo.me/public_html public_html www/manjo.me html; do
            if [ -d "$HOME/$d" ]; then echo "    FINNS:  $d"; else echo "    saknas: $d"; fi
          done
          if [ ! -d "$HOME/$target" ]; then
            echo "::error::Målkatalogen \$HOME/$target finns inte. Sätt REMOTE_DIR-secret till rätt sökväg (se listan ovan)."
            echo "--- innehåll i hemkatalogen:"
            ls -la "$HOME"
            exit 1
          fi
          if [ ! -w "$HOME/$target" ]; then
            echo "::error::Målkatalogen \$HOME/$target är inte skrivbar för deploy-användaren."
            exit 1
          fi
          echo "--- målkatalog OK och skrivbar: $HOME/$target"
          echo "--- nuvarande innehåll (10 första):"
          ls -1 "$HOME/$target" | head -10
          REMOTE
      - name: Ladda upp med rsync över SSH
        # Icke-destruktivt: inget --delete, så filer som bara finns på servern
        # (attachments/, .env.production m.m.) rörs aldrig. I verify-läge körs
        # rsync med --dry-run och skriver alltså ingenting.
        run: |
          set -euo pipefail
          DRY_RUN=""
          if [ "$DEPLOY_MODE" != "deploy" ]; then
            DRY_RUN="--dry-run"
            echo "MODE=$DEPLOY_MODE -> torrkörning, inga filer skrivs."
          fi
          rsync -rltzv --no-perms --omit-dir-times $DRY_RUN \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.semgrepignore' \
            --exclude='CLAUDE.md' \
            --exclude='documentaion/' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='.env.*' \
            --exclude='*.log' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
      - name: Städa bort SSH-nyckeln
        if: always()
        run: rm -f ~/.ssh/deploy_key
