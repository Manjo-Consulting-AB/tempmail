<script>
(function () {
    var btn = document.getElementById('hamburgerBtn');
    var panel = document.getElementById('navbarMenu');
    if (!btn || !panel) return;

    function isOpen() { return btn.getAttribute('aria-expanded') === 'true'; }
    function setOpen(open) {
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        panel.classList.toggle('is-open', open);
    }
    function close(moveFocus) {
        if (!isOpen()) return;
        setOpen(false);
        if (moveFocus) btn.focus();
    }

    btn.addEventListener('click', function () { setOpen(!isOpen()); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(true); });
    // An outside click leaves focus where the user clicked; only Escape pulls it
    // back to the button.
    document.addEventListener('click', function (e) {
        if (!panel.contains(e.target) && !btn.contains(e.target)) close(false);
    });
})();
</script>
            <script>
            (function(){
                try {
                    var proExpiry = null;
                    var isProAccount = true;
                    if (!isProAccount) {
                        document.getElementById('proExpiryLine').textContent = 'Free';
                        return;
                    }
                    if (!proExpiry) {
                        document.getElementById('proExpiryLine').textContent = 'Pro: Lifetime';
                        return;
                    }
                    var d = new Date(proExpiry + ' UTC');
                    var dd = String(d.getUTCDate()).padStart(2, '0');
                    var mm = String(d.getUTCMonth() + 1).padStart(2, '0');
                    var yyyy = d.getUTCFullYear();
                    var dateOnly = dd + '/' + mm + '/' + yyyy;
                    var now = new Date();
                    var diffMs = d - now;
                    if (diffMs <= 0) {
                        document.getElementById('proExpiryLine').textContent = 'Pro expired on ' + dateOnly;
                        document.getElementById('proExpiryLine').style.color = '#ff6b6b';
                    } else {
                        document.getElementById('proExpiryLine').textContent = 'Pro expires: ' + dateOnly;
                    }
                } catch (e) {}
            })();
            
            </script>

    <script>
    $(function(){
        // Character counter
        $('#message').on('input', function(){
            var len = $(this).val().length;
            $('#charCount').text(len);
            if (len > 4500) {
                $('#charCount').addClass('text-warning');
            } else {
                $('#charCount').removeClass('text-warning');
            }
        });
        
        // Form submission
        $('#contactForm').on('submit', function(e){
            e.preventDefault();
            
            var $btn = $('#submitBtn');
            var originalText = $btn.html();
            
            // Disable button and show loading
            $btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Sending...');
            $('#contactAlert').html('');
            
            $.post('pro_contact.php', {
                category: $('#category').val(),
                message: $('#message').val()
            }, function(res){
                if (res && res.success) {
                    $('#contactAlert').html(
                        '<div class="alert alert-success">' +
                        '<i class="fas fa-check-circle"></i> ' + (res.message || 'Message sent successfully!') +
                        '</div>'
                    );
                    // Reset form
                    $('#contactForm')[0].reset();
                    $('#charCount').text('0');
                } else {
                    $('#contactAlert').html(
                        '<div class="alert alert-danger">' +
                        '<i class="fas fa-exclamation-circle"></i> ' + (res && res.error ? res.error : 'Failed to send message') +
                        '</div>'
                    );
                }
            }, 'json').fail(function(){
                $('#contactAlert').html(
                    '<div class="alert alert-danger">' +
                    '<i class="fas fa-exclamation-circle"></i> Network error. Please try again.' +
                    '</div>'
                );
            }).always(function(){
                $btn.prop('disabled', false).html(originalText);
            });
        });
    });
    </script>
